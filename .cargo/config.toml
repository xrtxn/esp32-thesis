[target.xtensa-esp32s3-none-elf]
runner = "espflash flash --monitor --chip esp32s3 --baud 921600 --partition-table partitions.csv"
rustflags = [
  "-C", "link-arg=-nostartfiles",
  "-C", "link-arg=-Tdefmt.x",
]

[target.riscv32imac-unknown-none-elf]
runner = "espflash flash --monitor --chip esp32c6 --baud 921600 --partition-table partitions.csv"
# runner = "probe-rs run --chip=esp32c6 --preverify --always-print-stacktrace --no-location --catch-hardfault"
rustflags = [
  "-C", "link-arg=-Tlinkall.x",
  # Required to obtain backtraces (e.g. when using the "esp-backtrace" crate.)
  # NOTE: May negatively impact performance of produced code
  "-C", "force-frame-pointers",
  "-C", "link-arg=-Tdefmt.x",
]

[env]
ESP_LOG="info,esp32_thesis=trace"
DEFMT_LOG="info,esp32_thesis=trace"

[build]
# Default target is set to ESP32-S3
# To switch to ESP32-C6, comment out the xtensa target and uncomment the riscv32 target below
# target = "xtensa-esp32s3-none-elf"
target = "riscv32imac-unknown-none-elf"

[unstable]
build-std = ["alloc", "core"]
